<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huviringid</title>
<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: linear-gradient(135deg, #7c3aed, #2563eb);
  color: #fff;
  padding: 27px;
}
header, .kaart, .vorm, button, input {
  border-radius: 16px;
  padding: 24px;
}
header, .kaart, .vorm {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  margin-bottom: 19px;
  animation: ilmu 1s;
}
@keyframes ilmu { from { opacity: 0; } }
h1, h2, p { font-size: 16px; font-weight: 400; }
.kaart { background: rgba(168, 85, 247, 0.4); }
.kaart:hover { transform: scale(1.05); }
.silt { background: #f59e0b; padding: 3px 9px; border-radius: 16px; font-size: 13px; }
.vaike { color: #a5b4fc; font-size: 13px; }
button {
  background: linear-gradient(90deg, #14b8a6, #06b6d4);
  color: #fff;
  border: none;
  font-size: 16px;
}
.sulge { width: 20px; height: 20px; padding: 0; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>🚀 Kõik ühes kohas</h1>
  <p>✨ Alusta siit ja avasta võimalusi! ✨</p>
</header>

<div class="kaart">
  <span class="silt">Uus!</span>
  <h2>🎨 Kunstiring</h2>
  <p>Kunstiring</p>
  <p class="vaike">Teisipäeval kell 15.00, ruum 204</p>
  <button>✨ Vaata lähemalt ✨</button>
</div>

<div class="kaart">
  <span class="silt">Tasuta</span>
  <h2>🤖 Robootikaring</h2>
  <p>Robootikaring</p>
  <p class="vaike">Kolmapäeval kell 16.00, ruum 112</p>
  <button>🚀 Vaata lähemalt 🚀</button>
</div>

<div class="kaart">
  <span class="silt">Beta</span>
  <h2>🎭 Teatriring</h2>
  <p>Teatriring</p>
  <p class="vaike">Neljapäeval kell 15.30, aula</p>
  <button>🎯 Vaata lähemalt 🎯</button>
</div>

<div class="vorm">
  <h2>📝 Registreeru</h2>
  <label>Nimi</label>
  <input placeholder="Nimi">
  <button>🎉 Saada 🎉</button>
  <button class="sulge">✖</button>
</div>
</body>
</html>
